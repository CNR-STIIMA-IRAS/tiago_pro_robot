play_motion2:
  ros__parameters:
    motion_planner:
      disable_motion_planning: false
      planning_groups: # Sorted by order of preference
        - arms_both_torso
        - arm_left_torso
        - arm_left
        - arm_right_torso
        - arm_right
        - torso
      exclude_from_planning_joints:
        - head_1_joint
        - head_2_joint
      joint_tolerance: 0.01

      # Parameters for non-planed approach
      approach_vel: 0.5
      approach_min_duration: 0.5