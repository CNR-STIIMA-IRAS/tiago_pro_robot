${ARM_SIDE_PREFIX}_cartesian_vel_controller:
  ros__parameters:
    type: tsid_controllers/CartesianVelocityController
    
    joint_state_names:
      - ${ARM_SIDE_PREFIX}_1_joint
      - ${ARM_SIDE_PREFIX}_2_joint
      - ${ARM_SIDE_PREFIX}_3_joint
      - ${ARM_SIDE_PREFIX}_4_joint
      - ${ARM_SIDE_PREFIX}_5_joint
      - ${ARM_SIDE_PREFIX}_6_joint
      - ${ARM_SIDE_PREFIX}_7_joint

    joint_command_names:
      - ${ARM_SIDE_PREFIX}_1_joint
      - ${ARM_SIDE_PREFIX}_2_joint
      - ${ARM_SIDE_PREFIX}_3_joint
      - ${ARM_SIDE_PREFIX}_4_joint
      - ${ARM_SIDE_PREFIX}_5_joint
      - ${ARM_SIDE_PREFIX}_6_joint
      - ${ARM_SIDE_PREFIX}_7_joint

    interface_name: position

    ee_names:
      - ${ARM_SIDE_PREFIX}_7_link

    velocity_scaling: 1.0

    posture_gain: 1.0

    cartesian_vel_gain:
        ${ARM_SIDE_PREFIX}_7_link:
          kp_x: 250.0
          kp_y: 250.0
          kp_z: 250.0
          kp_roll: 250.0
          kp_pitch: 250.0
          kp_yaw: 250.0
          ki_x: 0.5
          ki_y: 0.5
          ki_z: 0.5
          ki_roll: 0.5
          ki_pitch: 0.5
          ki_yaw: 0.5
          kd_x: 1.0
          kd_y: 1.0
          kd_z: 1.0
          kd_roll: 1.0
          kd_pitch: 1.0
          kd_yaw: 1.0




